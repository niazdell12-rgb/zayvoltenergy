name: Rebuild product pages

# Regenerates static product HTML (with correct SEO meta tags) and
# commits the changes back to the repo. GitHub Pages automatically
# republishes whenever this branch updates — no separate deploy step.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours; change as you like
  workflow_dispatch: {}       # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Generate static product pages
        run: node scripts/generate-static-products.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product/ sitemap-products.xml
          git diff --staged --quiet || git commit -m "Auto-update product pages"
          git push

# --- One-time setup ---
# 1. Repo secret FIREBASE_SERVICE_ACCOUNT: paste the full JSON content of
#    a service account key (Firebase Console > Project Settings >
#    Service Accounts > Generate new private key).
# 2. Settings > Pages > Source: deploy from the "main" branch, root folder.
# That's it — no Firebase CLI, no deploy tokens, no Blaze plan.
